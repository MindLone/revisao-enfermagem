name: Assemble bonus images
# Retry after validating all three optimized image chunks.

on:
  push:
    paths:
      - '.github/workflows/assemble-bonus-images.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build optimized bonus assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          cat _asset_parts/cronograma.*.b64 | tr -d '\r\n' | base64 -d > assets/cronograma-de-estudos.avif
          cat _asset_parts/mural.*.b64 | tr -d '\r\n' | base64 -d > assets/mural-de-mnemonicos.avif
          cat _asset_parts/caderno.*.b64 | tr -d '\r\n' | base64 -d > assets/caderno-de-erros.avif

          test -s assets/cronograma-de-estudos.avif
          test -s assets/mural-de-mnemonicos.avif
          test -s assets/caderno-de-erros.avif

          cat > bonus-images.css <<'EOF'
          /* Artes dos bônus — arquivos AVIF transparentes e otimizados para mobile */
          #bonus-exclusivos .bonus-visual {
            background-color: transparent !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-size: contain !important;
          }

          #bonus-exclusivos .bonus-visual::before,
          #bonus-exclusivos .bonus-visual::after {
            content: none !important;
            display: none !important;
          }

          #bonus-exclusivos .bonus-visual[data-bonus-image="cronograma"] {
            background-image: url("/assets/cronograma-de-estudos.avif") !important;
          }

          #bonus-exclusivos .bonus-visual[data-bonus-image="mnemonicos"] {
            background-image: url("/assets/mural-de-mnemonicos.avif") !important;
          }

          #bonus-exclusivos .bonus-visual[data-bonus-image="caderno-erros"] {
            background-image: url("/assets/caderno-de-erros.avif") !important;
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <link rel="stylesheet" href="/home-tweaks.css" />'
          link = '  <link rel="stylesheet" href="/bonus-images.css" />'
          if link not in s:
              if marker not in s:
                  raise SystemExit('home-tweaks.css marker not found')
              s = s.replace(marker, marker + '\n' + link, 1)
          p.write_text(s, encoding='utf-8')
          PY

          rm -rf _asset_parts

      - name: Commit final site assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Adiciona imagens dos bônus ao site"
          git push origin HEAD:main
